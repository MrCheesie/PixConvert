<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixConvert</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
      <div>
          <h1>
              Drop a file here
          </h1>
          <div id="dropZone">
            <span class="drop-zone__prompt">Drag & drop files here or click to upload</span>
            <!-- Hidden input field to handle the underlying file selection -->
            <input type="file" name="myFiles" id="fileInput" class="drop-zone__input" multiple>
          </div>

          <div id="fileList" class="file-list"></div>

          <label for="formatSelect">Select format to convert to</label>
          <select name="fileChooser" id="formatSelect">
              <option title="Best for lossless, transparent images, great for digital use." value="png">PNG</option>
              <option title="Best for images in websites." value="webp">WebP</option>
              <option title="Best for photos taken with a camera." value="jpeg">JPEG</option>
              <option title="Pronounced like the 'gif' in gift." value="gif">GIF </option>
          </select>
          <button id="convertBtn">Convert</button>
      </div>
  </body>
</html>
